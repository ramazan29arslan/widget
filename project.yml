# Xcode projesi XcodeGen ile üretilir:  brew install xcodegen && xcodegen
name: Pati

options:
  bundleIdPrefix: com.ramazan29arslan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Apple Developer hesabındaki Team ID'ni buraya yaz (Xcode > Signing'den de seçebilirsin)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Pati:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pati
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/Pati.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ramazan29arslan.pati
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramazan29arslan.pati
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: PatiWidgetExtension

  PatiWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - WidgetExtension
      - Shared
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Pati Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WidgetExtension/PatiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ramazan29arslan.pati
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramazan29arslan.pati.widget
        SKIP_INSTALL: YES
